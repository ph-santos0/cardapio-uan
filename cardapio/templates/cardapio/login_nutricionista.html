{% extends "cardapio/base.html" %}

{% block title %}
Login do Nutricionista
{% endblock %}

{% block content %}

<section class="login-area">
    <div class="login-card">
        <h2>Acesso do nutricionista</h2>

        <p>
            Informe seu usuário e sua senha para entrar no painel.
        </p>

        {% if erro %}
            <div class="mensagem-erro">
                {{ erro }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="campo">
                <label for="username">Usuário</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="campo">
                <label for="password">Senha</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button class="botao-login" type="submit">
                Entrar
            </button>
        </form>
    </div>
</section>

{% endblock %}
