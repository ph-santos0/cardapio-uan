{% extends "cardapio/base.html" %}

{% block title %}
Login do Nutricionista
{% endblock %}

{% block content %}

<div class="login-container">

    <div class="login-card">

        <h2>Acesso do Nutricionista</h2>

        <p>Entre com seu usuário e senha para acessar o painel.</p>

        {% if erro %}
            <div class="mensagem-erro">
                {{ erro }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="campo-formulario">
                <label for="username">Usuário</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >
            </div>

            <div class="campo-formulario">
                <label for="password">Senha</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <button type="submit" class="botao-login">
                Entrar
            </button>

        </form>

    </div>

</div>

{% endblock %}
